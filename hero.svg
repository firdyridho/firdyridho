<svg width="900" height="380" viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4FD1C5"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
    </filter>
  </defs>

  <!-- Outer card / browser window -->
  <rect x="8" y="8" width="884" height="364" rx="14" fill="url(#bg)" stroke="#1f2937" stroke-width="1.5"/>
  <rect x="8" y="8" width="884" height="364" rx="14" fill="url(#spot)"/>

  <!-- Decorative glow -->
  <circle cx="760" cy="60" r="150" fill="#4FD1C5" opacity="0.06" filter="url(#soft)"/>
  <circle cx="150" cy="330" r="140" fill="#38BDF8" opacity="0.05" filter="url(#soft)"/>

  <!-- Browser top bar -->
  <rect x="8" y="8" width="884" height="42" rx="14" fill="#161b22"/>
  <rect x="8" y="36" width="884" height="14" fill="#161b22"/>
  <circle cx="34" cy="29" r="6" fill="#ff5f56"/>
  <circle cx="54" cy="29" r="6" fill="#ffbd2e"/>
  <circle cx="74" cy="29" r="6" fill="#27c93f"/>

  <!-- URL bar -->
  <rect x="110" y="18" width="300" height="22" rx="6" fill="#0d1117" stroke="#2d333b" stroke-width="1"/>
  <circle cx="126" cy="29" r="4" fill="#4FD1C5" opacity="0.8"/>
  <text x="138" y="33" font-family="JetBrains Mono, Consolas, monospace" font-size="11" fill="#8b949e">firdyridho.dev</text>

  <!-- nav dots right -->
  <circle cx="836" cy="29" r="3" fill="#2d333b"/>
  <circle cx="820" cy="29" r="3" fill="#2d333b"/>
  <circle cx="804" cy="29" r="3" fill="#2d333b"/>

  <!-- Content area -->
  <text x="60" y="140" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#4FD1C5">&lt;hello world /&gt;</text>

  <text x="58" y="190" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#f0f6fc">Firdy Ridho Fillah</text>

  <text x="60" y="228" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#8b949e">Full-Stack Developer building scalable web systems</text>

  <!-- accent underline -->
  <rect x="60" y="245" width="120" height="4" rx="2" fill="url(#glow)"/>

  <!-- tag chips -->
  <g font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#c9d1d9">
    <rect x="60" y="272" width="66" height="30" rx="15" fill="#161b22" stroke="#2d333b"/>
    <text x="76" y="292">PHP</text>

    <rect x="136" y="272" width="80" height="30" rx="15" fill="#161b22" stroke="#2d333b"/>
    <text x="152" y="292">MySQL</text>

    <rect x="226" y="272" width="80" height="30" rx="15" fill="#161b22" stroke="#2d333b"/>
    <text x="242" y="292">React</text>

    <rect x="316" y="272" width="66" height="30" rx="15" fill="#161b22" stroke="#2d333b"/>
    <text x="332" y="292">Go</text>

    <rect x="392" y="272" width="130" height="30" rx="15" fill="#161b22" stroke="#2d333b"/>
    <text x="408" y="292">REST APIs</text>
  </g>

  <!-- cursor blink bar -->
  <rect x="60" y="315" width="2" height="18" fill="#4FD1C5">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
  <text x="72" y="329" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#6e7681">status: available for work</text>
</svg>
