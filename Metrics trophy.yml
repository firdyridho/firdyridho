name: Metrics Trophy

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  trophy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: firdyridho
          template: trophy
          base: ""
          plugin_achievements: yes
          plugin_achievements_threshold: C
